[install]
# 5-day quarantine: reject fresh package versions to reduce supply-chain risk.
minimumReleaseAge = 432_000
minimumReleaseAgeExcludes = [
  # First-party dependency consumed from the registry.
  "@stll/time", # quarantine-excluded-since: 2026-10-15
  # 2026-10-10: align Bun's type contract with the pinned runtime.
  # Remove this exception after 2026-10-16, once the five-day quarantine clears.
  "bun-types", # quarantine-expires: 2026-10-15T05:25:00.000Z
]
