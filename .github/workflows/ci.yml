name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset present for published package changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Discover publishable packages
        id: release-packages
        run: bun scripts/release-package-metadata.ts >> "$GITHUB_OUTPUT"

      - name: Enforce release intent
        # The repository owner publishes this versioned shared contract.
        uses: stella/.github/.github/actions/changeset-policy@5dafee16c28009f17d3bc088f8aecdf9ce47a6d5
        with:
          release-paths: ${{ steps.release-packages.outputs.release-paths }}
          generated-paths: ${{ steps.release-packages.outputs.generated-paths }}
          package-files: ${{ steps.release-packages.outputs.package-files }}
          version-file: bun.lock

  build-checks:
    name: Shared tooling checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun validates the resolved graph but does not refresh or validate cached
      # workspace self-versions. Release automation uses this same script in
      # byte-preserving --write mode; CI keeps it in check-only mode.
      - name: Lockfile workspace-version check
        run: bun run check:lockfile-versions

      # Fails a Version Packages PR before merge if a bump lands at or below a
      # version already on npm; the publish job repeats this gate.
      - name: Registry version check
        run: bun run check:registry-versions

      - name: Build shared commands
        run: bun run build

      - name: Typecheck diagnostic parity
        run: bun run check:typecheck-parity

      - name: Typecheck with TypeScript (timed)
        run: |
          /usr/bin/time -v sh -c '
            bun node_modules/typescript/bin/tsc --noEmit -p packages/oxlint-config &&
            bun node_modules/typescript/bin/tsc --noEmit -p packages/oxlint-plugin
          '

      - name: Typecheck with Bun (timed)
        run: /usr/bin/time -v bun run typecheck

      - name: Test
        run: bun run test

      - name: Validate consumer install lifecycle isolation
        run: bun scripts/check-consumer-install-lifecycle.ts

      - name: Lint
        run: bun run lint

      - name: Shared toolchain check
        run: |
          bun run check:toolchain
          node packages/oxlint-config/dist/toolchain-check-cli.mjs
          node packages/oxlint-config/dist/toolchain-changed-cli.mjs --since HEAD
          node packages/oxlint-config/dist/typecheck-parity-cli.mjs --changed-since HEAD
          node packages/oxlint-config/dist/typecheck-probe-cli.mjs --project packages/oxlint-config/tsconfig.json --seed-dir packages/oxlint-config/src -- bun check -p packages/oxlint-config

      - name: Published package contracts
        run: bun run check:publish-contract

      - name: Publint
        run: bun run publint

      - name: Pack dry run
        run: bun run pack:dry-run

      - name: Read shared release policy ref
        id: shared-policy
        run: bun scripts/check-release-selector-contract.ts ref >> "$GITHUB_OUTPUT"

      - name: Check out shared release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stella/.github
          ref: ${{ steps.shared-policy.outputs.ref }}
          path: .shared-policy
          persist-credentials: false

      - name: Check shared runtime selector contract
        run: bun scripts/check-release-selector-contract.ts check .shared-policy/.github/actions/release-policy/check.ts

      - name: Upload built shared commands
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-commands
          path: packages/oxlint-config/dist
          if-no-files-found: error

  engine-floor:
    name: Published package Node floor
    needs: build-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up published package Node floor
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download built shared commands
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-commands
          path: packages/oxlint-config/dist

      - name: Check built publish target CLI on Node floor
        run: node scripts/check-publish-target-node-floor.mjs

  checks:
    if: always()
    needs: [build-checks, engine-floor]
    runs-on: ubuntu-latest
    steps:
      - name: Require shared checks and Node floor success
        env:
          BUILD_RESULT: ${{ needs.build-checks.result }}
          FLOOR_RESULT: ${{ needs.engine-floor.result }}
        run: test "$BUILD_RESULT" = success && test "$FLOOR_RESULT" = success

  rust-lints:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust lint toolchain
        run: |
          rustup toolchain install nightly-2026-04-16 --profile minimal \
            --component rustc-dev \
            --component llvm-tools-preview
          cargo install dylint-link --version 6.0.1 --locked

      - name: Test Rust lints
        run: cd rust-lints/stella_lints && cargo test
