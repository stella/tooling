name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset present for published package changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Discover publishable packages
        id: release-packages
        run: bun scripts/release-package-metadata.ts >> "$GITHUB_OUTPUT"

      - name: Enforce release intent
        # The repository owner publishes this versioned shared contract.
        uses: stella/.github/.github/actions/changeset-policy@a98150379a0659f9ff603970a06dbdee56f7c4cb
        with:
          release-paths: ${{ steps.release-packages.outputs.release-paths }}
          generated-paths: ${{ steps.release-packages.outputs.generated-paths }}
          package-files: ${{ steps.release-packages.outputs.package-files }}
          version-file: bun.lock

  build-checks:
    name: Shared tooling checks
    runs-on: ubuntu-24.04
    env:
      TOOLCHAIN_BASE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || (github.event_name == 'push' && github.event.before) || 'unavailable-toolchain-base' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release from clean build outputs
        run: bash scripts/verify-release.sh

      - name: Check formatting
        id: format
        run: bun fmt --check

      # A contributor without the pinned Bun applies this patch instead of
      # reformatting by hand.
      - name: Produce the formatting patch
        if: failure() && steps.format.outcome == 'failure'
        run: bun fmt && git diff --binary > bun-fmt.patch

      - name: Upload the formatting patch
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bun-fmt-patch
          path: bun-fmt.patch

      - name: Typecheck diagnostic parity
        run: bun run check:typecheck-parity --changed-since "$TOOLCHAIN_BASE"

      - name: Validate actual declaration-only build profile
        run: bun scripts/check-publish-artifact-profiles.ts

      - name: Validate consumer install lifecycle isolation
        run: bun scripts/check-consumer-install-lifecycle.ts

      - name: Shared toolchain check
        run: |
          bun run check:toolchain
          node packages/oxlint-config/dist/dependabot-cli.mjs --config stll-dependabot.json --check
          node packages/oxlint-config/dist/toolchain-check-cli.mjs
          node packages/oxlint-config/dist/toolchain-changed-cli.mjs --since "$TOOLCHAIN_BASE"

      - name: Published package contracts
        run: bun run check:publish-contract

      - name: Pack dry run
        run: bun run pack:dry-run

      - name: Read shared release policy ref
        id: shared-policy
        run: bun scripts/check-release-selector-contract.ts ref >> "$GITHUB_OUTPUT"

      - name: Check out shared release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stella/.github
          ref: ${{ steps.shared-policy.outputs.ref }}
          path: .shared-policy
          persist-credentials: false

      - name: Check shared runtime selector contract
        run: bun scripts/check-release-selector-contract.ts check .shared-policy/.github/actions/release-policy/check.ts

      - name: Upload built shared commands
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-commands
          path: packages/oxlint-config/dist
          if-no-files-found: error

  engine-floor:
    name: Published package Node floor
    needs: build-checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up published package Node floor
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.19.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download built shared commands
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shared-commands
          path: packages/oxlint-config/dist

      - name: Check built publish target CLI on Node floor
        run: node scripts/check-publish-target-node-floor.mjs

  ci-result:
    if: always()
    needs:
      [changeset, build-checks, engine-floor, rust-lints, hawk-compatibility]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGESET_RESULT: ${{ needs.changeset.result }}
          BUILD_RESULT: ${{ needs.build-checks.result }}
          FLOOR_RESULT: ${{ needs.engine-floor.result }}
          RUST_RESULT: ${{ needs.rust-lints.result }}
          HAWK_RESULT: ${{ needs.hawk-compatibility.result }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$CHANGESET_RESULT" = success
          else
            test "$CHANGESET_RESULT" = skipped
          fi
          test "$BUILD_RESULT" = success
          test "$FLOOR_RESULT" = success
          test "$RUST_RESULT" = success
          test "$HAWK_RESULT" = success

  rust-lints:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: Test stable source lint
        env:
          RUSTUP_TOOLCHAIN: "1.99.0"
        run: cargo test --manifest-path rust-lints/stella_source_lint/Cargo.toml --locked

  hawk-compatibility:
    name: Hawk compiler compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out consumer crate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stella/regex-set
          ref: ae63e774bca2a22878c88e165bb60f2d9a12027e
          persist-credentials: false

      - name: Install documented Hawk compiler exception
        run: rustup toolchain install 1.97.1 --profile minimal --component rustc-dev

      - name: Build pinned Hawk
        # Hawk's documented source install requires rustc_private opt-in.
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo +1.97.1 install cargo-hawk --version 0.1.11 --locked --root "$RUNNER_TEMP/hawk"

      - name: Check consumer crate with the Hawk compiler
        env:
          CARGO_BUILD_RUSTC_WRAPPER: ""
        run: |
          unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER
          export PATH="$RUNNER_TEMP/hawk/bin:$PATH"
          cat > hawk.toml <<'HAWK_CONFIG'
          [[production]]
          package = "stella-regex-set"
          lib = "stella_regex_set"
          reason = "Shared native library compatibility probe"
          HAWK_CONFIG
          cargo +1.97.1 hawk check --target-dir "$RUNNER_TEMP/hawk-target" -A hawk::dead_public -A hawk::unnecessary_public
