name: Cloud setup integration

on:
  pull_request:
    paths:
      - .github/workflows/cloud-setup.yml
      - scripts/cloud-setup-integration*.ts
      - packages/oxlint-config/src/cloud-setup*.ts
      - packages/oxlint-config/src/toolchain*.ts
      - packages/oxlint-config/toolchain.json
      - package.json
      - bun.lock
      - .node-version
  push:
    branches: [main]
    paths:
      - .github/workflows/cloud-setup.yml
      - scripts/cloud-setup-integration*.ts
      - packages/oxlint-config/src/cloud-setup*.ts
      - packages/oxlint-config/src/toolchain*.ts
      - packages/oxlint-config/toolchain.json
      - package.json
      - bun.lock
      - .node-version

permissions:
  contents: read

jobs:
  engines:
    name: Generated setup with PostgreSQL and Valkey
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run generated setup engine integration
        run: bun scripts/cloud-setup-integration.ts
