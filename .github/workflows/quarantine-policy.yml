name: Package quarantine policy

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce package quarantine
    if: github.repository == 'stella/tooling'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-policy.yml@a98150379a0659f9ff603970a06dbdee56f7c4cb
