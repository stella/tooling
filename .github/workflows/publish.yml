name: Publish

on:
  push:
    branches: [main]
    paths:
      # Changesets owns these files, so ordinary manifest maintenance cannot
      # accidentally start a release transaction.
      - packages/*/CHANGELOG.md
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Publish missing package versions after verification
        required: true
        default: false
        type: boolean
      artifact_run_id:
        description: Exact prior publish run whose artifacts should be resumed
        required: false
        default: ""
        type: string
      source_ref:
        description: Exact source SHA matching the recovery artifacts
        required: false
        default: ""
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-metadata:
    name: Discover publishable packages
    runs-on: ubuntu-latest
    outputs:
      package-directories: ${{ steps.release-packages.outputs.package-directories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Discover publishable packages
        id: release-packages
        run: bun scripts/release-package-metadata.ts >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile
      - run: bun run check:lockfile-versions
      - run: bun run check:registry-versions
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run publint

  pack:
    name: Build and pack ${{ matrix.package }}
    needs: [release-metadata, verify]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.release-metadata.outputs.package-directories) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up npm
        run: npm install --global --ignore-scripts npm@11.11.1

      - run: bun install --frozen-lockfile

      - name: Build and pack
        env:
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          bun --cwd "packages/${PACKAGE}" --if-present build
          mkdir -p release-artifacts
          (
            cd "packages/${PACKAGE}"
            npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/release-artifacts"
          )

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-${{ matrix.package }}
          path: release-artifacts/*.tgz
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish packages
    needs: [release-metadata, pack]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || inputs.publish_to_npm)
    permissions:
      actions: read
      contents: write
      id-token: write
    # Keep this caller filename stable: npm trusted publishing authorizes it.
    uses: stella/.github/.github/workflows/npm-independent-release.yml@5b5e00c3fc77eda2d557815fb3ee148c69314480
    with:
      artifact-run-id: ${{ inputs.artifact_run_id || '' }}
      artifact-pattern: npm-tarball-*
      package-files: |
        packages/oxlint-config/package.json
        packages/oxlint-plugin/package.json
        packages/typescript-config/package.json
      source-ref: ${{ inputs.source_ref || '' }}
