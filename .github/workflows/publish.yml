name: Publish

on:
  push:
    branches: [main]
    paths:
      # Changesets owns these files, so ordinary manifest maintenance cannot
      # accidentally start a release transaction.
      - packages/typescript-config/CHANGELOG.md
      - packages/oxlint-config/CHANGELOG.md
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Publish missing package versions after verification
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: "22"
  NPM_VERSION: "11.11.1"
  BUN_VERSION: "1.3.14"

jobs:
  pack:
    name: Build and pack ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [typescript-config, oxlint-config]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up npm
        run: npm install --global --ignore-scripts "npm@${{ env.NPM_VERSION }}"

      - run: bun install --frozen-lockfile

      - name: Build and pack
        env:
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PACKAGE" == "oxlint-config" ]]; then
            bun --filter @stll/oxlint-config build
          fi
          mkdir -p release-artifacts
          (
            cd "packages/${PACKAGE}"
            npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/release-artifacts"
          )

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-tarball-${{ matrix.package }}
          path: release-artifacts/*.tgz
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish packages
    needs: pack
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || inputs.publish_to_npm)
    permissions:
      contents: write
      id-token: write
    # Keep this caller filename stable: npm trusted publishing authorizes it.
    uses: stella/.github/.github/workflows/npm-independent-release.yml@c47bb87cc82047b5fdc2540983148d4e3efa9a37 # v1.3.0
    with:
      artifact-pattern: npm-tarball-*
      package-files: |
        packages/typescript-config/package.json
        packages/oxlint-config/package.json
