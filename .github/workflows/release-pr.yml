name: Release PR

on:
  push:
    branches: [main]

concurrency:
  # Let the active mutation finish; the shared workflow skips obsolete queued
  # source revisions before it receives write credentials.
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Maintain Version Packages PR
    permissions:
      contents: read
      pull-requests: read
      checks: read
    # The repository owner publishes this versioned shared contract.
    uses: stella/.github/.github/workflows/changeset-release-pr.yml@5764ab66e4df84cfd2e642c7d7e4678261e668f8
    with:
      bun-version-file: package.json
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
