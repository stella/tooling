name: Release policy

on:
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - .github/workflows/release-policy.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
      - .github/workflows/release-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce release boundaries
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/release-policy.yml@5d52bc7a8f010bf6f5f9e720eff39cf55469bb2b # runtime version file selectors
    with:
      workflow: .github/workflows/publish.yml
