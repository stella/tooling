name: Package quarantine prune

on:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read

jobs:
  prune:
    name: Remove expired quarantine exceptions
    if: github.repository == 'stella/tooling'
    permissions:
      contents: read
    uses: stella/.github/.github/workflows/quarantine-prune.yml@5b5e00c3fc77eda2d557815fb3ee148c69314480
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
