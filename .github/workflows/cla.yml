name: CLA Assistant

on:
  issue_comment:
    types: [created]
  merge_group:
    types: [checks_requested]
  pull_request_target: # zizmor: ignore[dangerous-triggers] delegates to pinned reusable CLA workflow; never check out PR code here
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: write # Reports the contributor check on PR and merge-group heads.

jobs:
  cla:
    if: >-
      (
        github.event_name == 'pull_request_target'
        || github.event_name == 'merge_group'
      ) || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && (
          github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    uses: stella/.github/.github/workflows/cla.yml@042baebaf071329b956555c05caf5736504c278d
    with:
      allowlist: dependabot[bot],renovate[bot],github-actions[bot],stella-provenance-updater[bot],google-labs-jules[bot],cursoragent
    secrets:
      CLA_APP_PRIVATE_KEY: ${{ secrets.CLA_APP_PRIVATE_KEY }}
